
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FourWays</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
<div class="logo">FOUR<span>WAYS</span></div>
<div class="subtitle">FOUR PLAYER STRATEGY GAME</div>
</header>
<main>
<section class="setup-panel" id="setupPanel">
<h2>GAME SETUP</h2>
<label for="gameMode">対戦モード</label>
<select id="gameMode">
<option value="ai">1人 vs AI 3人</option>
<option value="local">4人ローカル対戦</option>
</select>
<label for="aiDifficulty">AIの強さ</label>
<select id="aiDifficulty">
<option value="easy">かんたん</option>
<option value="normal" selected>普通</option>
<option value="hard">強い</option>
</select>
<button id="startGame" class="start-button">ゲームスタート</button>
</section>
<div id="gameArea" class="game-area hidden">
<section class="game-info">
<div class="turn-box">
<div class="small-label">CURRENT TURN</div>
<div id="turnPlayer" class="turn-player">🔴 RED PLAYER</div>
<div id="turnNumber" class="turn-number">ROUND 1</div>
</div>
<div class="goal-box">
<div class="small-label">DESTINATION</div>
<div class="goal-text">★ CENTRAL GOAL</div>
</div>
</section>
<section class="players" id="players"></section>
<section class="board-section">
<div class="board-heading">
<span>GAME BOARD</span>
<span>11 × 11 GRID</span>
</div>
<div id="board" class="board"></div>
</section>
<section class="control-panel">
<div id="message">🔴 赤プレイヤーのターンです。</div>
<div class="controls">
<button id="moveMode" class="active">コマ移動</button>
<button id="wallMode">壁を設置</button>
</div>
<div class="wall-info">横壁・縦壁は各プレイヤー10個</div>
<div class="wall-controls">
<div class="wall-choice-title">設置する壁を選択</div>
<div class="wall-choice-list">
<button id="wallDirection" class="wall-choice">
<span class="wall-icon horizontal-icon"></span>
<span class="wall-choice-name">横壁</span>
<span class="wall-choice-desc">横向き・2マス</span>
</button>
<button id="verticalDirection" class="wall-choice">
<span class="wall-icon vertical-icon"></span>
<span class="wall-choice-name">縦壁</span>
<span class="wall-choice-desc">縦向き・2マス</span>
</button>
</div>
</div>
<button id="backToSetup" class="back-button">設定に戻る</button>
</section>
</div>
<div id="onlineStatus" class="online-status">⚪ 接続確認中...</div>
</main>
<footer>FOURWAYS © 2026</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="game.js"></script>
<script src="online.js"></script>
<script>
window.initializeOnline();
</script>
</body>
</html>
